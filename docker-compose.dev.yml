# Apex API - Development Overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Features:
# - Hot reload via volume mount
# - Debug mode enabled
# - Exposed database port for local tools

services:
  postgres:
    # Expose port for local database tools (DBeaver, pgAdmin, etc.)
    ports:
      - "5432:5432"

  redis:
    # Expose port for local Redis tools (redis-cli, RedisInsight, etc.)
    ports:
      - "${REDIS_PORT:-6379}:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      DEBUG: "true"
      DB_ECHO: "true"
      LOG_FORMAT: "console"
      LOG_LEVEL: "DEBUG"
    volumes:
      # Mount source code for hot reload
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./alembic:/app/alembic:ro
      - ./tests:/app/tests:ro
      - ./.env.staging.example:/app/.env.staging.example:ro
      # Pass through coverage report to local filesystem
      - ./htmlcov:/app/htmlcov
    
  # Don't need separate migrations container in dev - run manually
  migrations:
    profiles:
      - tools
