name: CI / Deploy Staging

# =============================================================================
# Trigger Rules
# =============================================================================
# - Every push to `master` runs full CI + deploys to staging
# - Every PR targeting `main` or `develop` runs CI only (no deploy)
# - Manual trigger available via GitHub UI (Actions → Run workflow)
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:          # Allow manual trigger from GitHub UI
    inputs:
      deploy:
        description: "Deploy to staging after tests?"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

# =============================================================================
# Global settings
# =============================================================================
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/apex-api   # e.g. yourorg/apex-api
  PYTHON_VERSION: "3.13"

# Cancel in-progress runs for the same branch (saves CI minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# =============================================================================
# Jobs
# =============================================================================
jobs:

  # ---------------------------------------------------------------------------
  # Job 1: Lint & Type Check
  # Fast gate — catches obvious errors before spinning up test DB
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0   # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1   # v8.3.1
        with:
          enable-cache: true           # Cache uv's package cache between runs

      - name: Install dependencies
        run: uv sync --frozen --extra dev  # Include dev extras (ruff, mypy, pytest-cov)

      - name: Run ruff linter
        run: uv run ruff check src/

      - name: Run ruff formatter check
        run: uv run ruff format --check src/

      - name: Run mypy type checker
        run: uv run mypy src/ --ignore-missing-imports --strict

  # ---------------------------------------------------------------------------
  # Job 2: Unit Tests
  # Fast, no DB — runs in parallel with lint
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0   # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1   # v8.3.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run unit tests
        run: |
          uv run pytest tests/unit/ \
            -v \
            --tb=short \
            --no-header \
            --cov=src \
            --cov-report=xml:coverage-unit.xml \
            --cov-report=term-missing
        env:
          # Minimal env needed to satisfy Settings validation
          JWT_SECRET_KEY: "ci-unit-test-secret-key-32-bytes-long"

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        if: always()                   # Upload even if tests fail
        with:
          name: unit-coverage
          path: coverage-unit.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 3: Integration Tests
  # Spins up real PostgreSQL via service container
  # ---------------------------------------------------------------------------
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint]                      # Don't bother if lint fails

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: apex_test
          POSTGRES_PASSWORD: apex_test
          POSTGRES_DB: apex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apex_test -d apex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0   # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1   # v8.3.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run database migrations
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://apex_test:apex_test@localhost:5432/apex_test
          JWT_SECRET_KEY: "ci-integration-test-secret-32-bytes"

      - name: Run integration tests
        run: |
          uv run pytest tests/integration/ \
            -v \
            --tb=short \
            --no-header \
            --cov=src \
            --cov-report=xml:coverage-integration.xml \
            --cov-report=term-missing
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://apex_test:apex_test@localhost:5432/apex_test
          DATABASE_URL: postgresql+asyncpg://apex_test:apex_test@localhost:5432/apex_test
          JWT_SECRET_KEY: "ci-integration-test-secret-32-bytes"
          R2_ACCOUNT_ID: test
          R2_ACCESS_KEY_ID: test
          R2_SECRET_ACCESS_KEY: test
          R2_BUCKET_NAME: apex-test

      - name: Upload integration coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        if: always()
        with:
          name: integration-coverage
          path: coverage-integration.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 4: SonarQube Analysis
  # Runs after both test jobs so it can merge both coverage reports
  # ---------------------------------------------------------------------------
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always() && !cancelled()      # Run even if tests fail, to get partial coverage

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0   # v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Download unit coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8.0.1
        with:
          name: unit-coverage
          path: .

      - name: Download integration coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8.0.1
        with:
          name: integration-coverage
          path: .

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e   # v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ---------------------------------------------------------------------------
  # Job 5: Build & Push Docker Image
  # Only runs on `master` branch (not PRs), after tests pass
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]

    # Only push image on actual commits to master (not PRs)
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/master' ||
      github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true'

    permissions:
      contents: read
      packages: write              # Required to push to GHCR

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0   # v7

      # Speeds up multi-platform builds significantly
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c   # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0   # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # Auto-provided by GitHub, no setup needed

      # Generates image tags and labels from git metadata
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302   # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Always tag as :staging for master branch
            type=raw,value=staging,enable={{is_default_branch}}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/master' }}
            # Also tag with short SHA for traceability (e.g. :sha-abc1234)
            type=sha,prefix=sha-,format=short
            # Tag with branch name (e.g. :master)
            type=ref,event=branch

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a   # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers in GHCR — dramatically speeds up subsequent builds
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          # Build args for reproducibility
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}

  # ---------------------------------------------------------------------------
  # Job 6: Deploy to Staging (Portainer webhook)
  # Triggers Portainer to pull the new :staging image and redeploy
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-push]
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}   # Update to your actual domain

    steps:
      - name: Trigger Portainer stack redeploy
        run: |
          echo "Triggering Portainer redeploy for staging stack..."

          HTTP_CODE=$(curl \
            -H "CF-Access-Client-Id: ${{ secrets.CF_CLIENT_ID }}" \
            -H "CF-Access-Client-Secret: ${{ secrets.CF_CLIENT_SECRET }}" \
            --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --max-time 300 --retry 3 --retry-delay 10 --retry-all-errors \
            --request POST \
            "${{ secrets.PORTAINER_WEBHOOK_URL }}")
          echo "Portainer webhook returned HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "ERROR: Portainer webhook failed (HTTP $HTTP_CODE)"
            exit 1
          fi

      - name: Wait for staging to be healthy
        run: |
          echo "Waiting for staging API to become healthy..."
          STAGING_URL="${{ vars.STAGING_URL }}/health/ready"
          MAX_ATTEMPTS=24    # 24 x 10s = 4 minutes max wait
          ATTEMPT=0

          until curl --silent --fail --max-time 5 "$STAGING_URL" > /dev/null 2>&1; do
            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
              echo "ERROR: Staging health check failed after $((MAX_ATTEMPTS * 10))s"
              exit 1
            fi
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS — waiting 10s..."
            sleep 10
          done

          echo "Staging is healthy at $STAGING_URL"

      - name: Verify deployed build SHA matches
        run: |
          echo "Confirming staging is serving the SHA we just deployed..."
          STAGING_URL="${{ vars.STAGING_URL }}/health/ready"
          MAX_ATTEMPTS=24    # 24 x 10s = 4 minutes max wait
          ATTEMPT=0

          while true; do
            set +e
            DEPLOYED_SHA=$(curl --silent --fail --max-time 5 "$STAGING_URL" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('build_sha',''))")
            set -e
            if [ "$DEPLOYED_SHA" = "${{ github.sha }}" ]; then
              echo "Deployed build_sha: $DEPLOYED_SHA (matches expected ${{ github.sha }})"
              break
            fi
            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
              echo "ERROR: staging is serving '$DEPLOYED_SHA', expected '${{ github.sha }}' — redeploy did not take effect"
              exit 1
            fi
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS — deployed_sha='$DEPLOYED_SHA', waiting 10s..."
            sleep 10
          done

      - name: Notify deployment success
        if: success()
        run: |
          echo "Staging deployment complete!"
          echo "SHA: ${{ github.sha }}"
          echo "Image: ${{ needs.build-and-push.outputs.image-tag }}"
          echo "URL: ${{ vars.STAGING_URL }}"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "Staging deployment FAILED for SHA ${{ github.sha }}"
          echo "URL: ${{ vars.STAGING_URL }}"
          # Optional: add Slack/Discord/email notification here
          exit 1
