# =============================================================================
# Apex API - Staging Environment Overrides
# =============================================================================
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
#
# Prerequisites:
#   - Copy .env.staging.example to .env.staging and fill in values
#   - Run with: docker compose --env-file .env.staging \
#               -f docker-compose.yml -f docker-compose.staging.yml up -d
#
# Differences from production:
#   - More verbose logging (DEBUG level, JSON format)
#   - Separate named DB volume (isolated from prod data)
#   - Separate R2 bucket (apex-staging)
#   - `unless-stopped` restart (easier crash inspection vs `always`)
#   - Relaxed resource limits
#   - cloudflared sidecar for Cloudflare Tunnel exposure
# =============================================================================

services:

  # ===========================================================================
  # PostgreSQL - Staging (isolated volume)
  # ===========================================================================
  postgres:
    container_name: apex-postgres-staging
    ports: []  # Never expose DB externally in staging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apex_staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-apex_staging}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  # ===========================================================================
  # Redis - Staging (rate limiting backend)
  # ===========================================================================
  redis:
    container_name: apex-redis-staging
    ports: []  # Never expose Redis to the host
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ===========================================================================
  # Apex API - Staging
  # ===========================================================================
  api:
    container_name: apex-api-staging
    # Use pre-built image tagged as :staging (pushed by CI)
    # Override `build` from base compose to prevent accidental local builds
    image: ${API_IMAGE:?API_IMAGE is required (e.g. ghcr.io/yourorg/apex-api:staging)}
    build: !reset null
    environment:
      # --- Core ---
      DEBUG: "false"
      API_HOST: "0.0.0.0"
      API_PORT: "8100"
      WORKERS: "2"

      # --- Logging ---
      # More verbose than prod: DEBUG level but still JSON for structured output
      LOG_LEVEL: "DEBUG"
      LOG_FORMAT: "json"

      # --- Deployment identity ---
      # Namespaces worker leader-lease keys and is logged at startup
      # (app.build_info). MUST differ between staging and production — with the
      # default (`development`) both would use identical lease keys.
      ENVIRONMENT: "staging"

      # --- Rate limiting: client IP trust ---
      # cloudflared (below) is the only path in — it terminates the Cloudflare
      # Tunnel and connects straight to api:8100, so CF-Connecting-IP is set by
      # Cloudflare's edge and cannot be spoofed by a client. Without this, every
      # request logs client_ip=<cloudflared container IP> and rate limiting keys
      # on that single shared address instead of the real caller.
      TRUSTED_IP_HEADER: "cf-connecting-ip"

      # --- Database ---
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-apex_staging}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-apex_staging}"
      DB_POOL_SIZE: ${DB_POOL_SIZE:-3}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      DB_ECHO: "false"

      # --- JWT ---
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ISSUER: ${JWT_ISSUER:-apex-api-staging}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}

      # --- Storage (use a SEPARATE staging bucket!) ---
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?R2_ACCOUNT_ID is required}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID is required}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY is required}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-apex-staging}

      # --- Public assets bucket (currency logos; distinct from the private
      # user-content bucket above — see .env.example). Optional: unset disables
      # logo caching but availability/metadata sync still runs.
      R2_PUBLIC_ASSETS_BUCKET: ${R2_PUBLIC_ASSETS_BUCKET:-}
      R2_PUBLIC_ASSETS_URL_BASE: ${R2_PUBLIC_ASSETS_URL_BASE:-}

      # --- Content retention (see .env.example) ---
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
      CONTENT_CLEANUP_ENABLED: ${CONTENT_CLEANUP_ENABLED:-true}
      CONTENT_CLEANUP_INTERVAL_SECONDS: ${CONTENT_CLEANUP_INTERVAL_SECONDS:-900}
      CONTENT_CLEANUP_BATCH_SIZE: ${CONTENT_CLEANUP_BATCH_SIZE:-500}
      CONTENT_CLEANUP_MAX_BATCHES_PER_RUN: ${CONTENT_CLEANUP_MAX_BATCHES_PER_RUN:-20}

      # --- Payment currency catalog sync (see .env.example) ---
      PAYMENT_CURRENCY_SYNC_INTERVAL_SECONDS: ${PAYMENT_CURRENCY_SYNC_INTERVAL_SECONDS:-10800}

      # --- AI Providers ---
      XAI_API_KEY: ${XAI_API_KEY:-}
      GROK_VIDEO_FINALIZATION_LEASE_SECONDS: ${GROK_VIDEO_FINALIZATION_LEASE_SECONDS:-120}
      GROK_MODERATION_BILLING_POLICY: ${GROK_MODERATION_BILLING_POLICY:-charge}
      COMFYUI_HOST: ${COMFYUI_HOST:-host.docker.internal}
      COMFYUI_PORT: ${COMFYUI_PORT:-18188}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}

      # --- Vast.ai (GPU node provisioning) ---
      VASTAI_API_KEY: ${VASTAI_API_KEY:?VASTAI_API_KEY is required for GPU sessions}

      # --- Cloudflare API (per-session GPU node tunnels — distinct from CLOUDFLARE_TUNNEL_TOKEN) ---
      AISHA_CF_API_TOKEN: ${AISHA_CF_API_TOKEN:?AISHA_CF_API_TOKEN is required for per-session GPU tunnels}
      AISHA_CF_ACCOUNT_ID: ${AISHA_CF_ACCOUNT_ID:?AISHA_CF_ACCOUNT_ID is required}
      AISHA_CF_ZONE_ID: ${AISHA_CF_ZONE_ID:?AISHA_CF_ZONE_ID is required}
      AISHA_CF_TUNNEL_DOMAIN: ${AISHA_CF_TUNNEL_DOMAIN:?AISHA_CF_TUNNEL_DOMAIN is required (e.g. your-gpu-domain.com)}

      # --- Aisha CLI runtime (forwarded to GPU nodes via vastai_client.create_instance) ---
      AI_BUNDLES_GITHUB_TOKEN: ${AI_BUNDLES_GITHUB_TOKEN:?AI_BUNDLES_GITHUB_TOKEN is required (PAT for private gearbox/ai-bundles)}
      AI_BUNDLES_REPO_URL: ${AI_BUNDLES_REPO_URL:-https://github.com/gearbox/ai-bundles.git}
      AI_BUNDLES_BRANCH: ${AI_BUNDLES_BRANCH:-master}
      AISHA_REPO_URL: ${AISHA_REPO_URL:-https://github.com/gearbox/aisha.git}
      AISHA_BRANCH: ${AISHA_BRANCH:-master}
      AISHA_COMFYUI_HOST: ${AISHA_COMFYUI_HOST:-0.0.0.0}
      AISHA_COMFYUI_EXTRA_ARGS: ${AISHA_COMFYUI_EXTRA_ARGS:-}

      # --- Model-download tokens (forwarded to GPU nodes; most bundles need HF_TOKEN) ---
      HF_TOKEN: ${HF_TOKEN:-}
      CIVITAI_API_TOKEN: ${CIVITAI_API_TOKEN:-}

      # --- Apex callback URL (phase-2; must be the public staging URL) ---
      APEX_CALLBACK_URL: ${APEX_CALLBACK_URL:?APEX_CALLBACK_URL is required (e.g. https://staging.your-domain.com)}

      # --- Aisha poller (background worker for ComfyUI job state) ---
      AISHA_POLLER_ENABLED: ${AISHA_POLLER_ENABLED:-true}
      AISHA_POLLER_TICK_INTERVAL_SECONDS: ${AISHA_POLLER_TICK_INTERVAL_SECONDS:-1.0}
      AISHA_POLLER_MAX_CONCURRENT_POLLS: ${AISHA_POLLER_MAX_CONCURRENT_POLLS:-16}
      AISHA_POLLER_JOB_AGE_WARNING_SECONDS: ${AISHA_POLLER_JOB_AGE_WARNING_SECONDS:-300}
      AISHA_POLLER_JOB_AGE_TIMEOUT_SECONDS: ${AISHA_POLLER_JOB_AGE_TIMEOUT_SECONDS:-1800}
      AISHA_POLLER_COMFYUI_REQUEST_TIMEOUT_SECONDS: ${AISHA_POLLER_COMFYUI_REQUEST_TIMEOUT_SECONDS:-5.0}

      # --- Video frame extraction ---
      FRAME_EXTRACT_MAX_VIDEO_SECONDS: ${FRAME_EXTRACT_MAX_VIDEO_SECONDS:-300}
      FRAME_EXTRACT_FFMPEG_TIMEOUT_SECONDS: ${FRAME_EXTRACT_FFMPEG_TIMEOUT_SECONDS:-30}
      FRAME_EXTRACT_POLL_INTERVAL_SECONDS: ${FRAME_EXTRACT_POLL_INTERVAL_SECONDS:-2}
      FRAME_PREVIEW_MAX_EDGE: ${FRAME_PREVIEW_MAX_EDGE:-512}
      FRAME_PREVIEW_URL_TTL_SECONDS: ${FRAME_PREVIEW_URL_TTL_SECONDS:-3600}
      FRAME_PREVIEW_RETENTION_DAYS: ${FRAME_PREVIEW_RETENTION_DAYS:-2}
      FRAME_EXTRACT_STALE_RUNNING_SECONDS: ${FRAME_EXTRACT_STALE_RUNNING_SECONDS:-1800}

      # --- Apex web-push (optional; for push notifications) ---
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?VAPID_PRIVATE_KEY is required for web-push}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?VAPID_PUBLIC_KEY is required for web-push}
      VAPID_SUBJECT: ${VAPID_SUBJECT:?VAPID_SUBJECT is required for web-push}

      # --- NowPayments (optional; for crypto payments) ---
      NOWPAYMENTS_API_KEY_VEX: ${NOWPAYMENTS_API_KEY_VEX:?NOWPAYMENTS_API_KEY_VEX is required}
      NOWPAYMENTS_IPN_SECRET_VEX: ${NOWPAYMENTS_IPN_SECRET_VEX:?NOWPAYMENTS_IPN_SECRET_VEX is required}
      NOWPAYMENTS_API_BASE: ${NOWPAYMENTS_API_BASE:-https://api.nowpayments.io}
      NOWPAYMENTS_IPN_CALLBACK_URL: ${NOWPAYMENTS_IPN_CALLBACK_URL:?NOWPAYMENTS_IPN_CALLBACK_URL is required}

    # Never expose the API port to the host — cloudflared connects to api:8100
    # inside the Docker network. This explicitly cancels any ports: defined in
    # the base docker-compose.yml.
    ports: []

    # Staging: restart unless-stopped so crashes are inspectable before Docker restarts
    restart: unless-stopped

    # Relaxed resource limits vs production
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

    networks:
      - apex-network

  # ===========================================================================
  # Migrations - Staging (runs once, then exits)
  # ===========================================================================
  migrations:
    container_name: apex-migrations-staging
    image: ${API_IMAGE:?API_IMAGE is required}
    build: !reset null
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-apex_staging}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-apex_staging}"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - apex-network

  # ===========================================================================
  # Cloudflare Tunnel - exposes staging to the internet via CF Zero Trust
  # ===========================================================================
  # Prerequisites:
  #   1. Create a tunnel in Cloudflare Zero Trust dashboard
  #   2. Add public hostname: staging.yourdomain.com → http://api:8100
  #   3. Copy the tunnel token to CLOUDFLARE_TUNNEL_TOKEN in .env.staging
  #   4. (Optional) Add an Access policy to gate behind email auth
  cloudflared:
    # cloudflared 2026.6.1
    image: cloudflare/cloudflared@sha256:6d91c121b803126f7a5344005d17a9324788fc09d305b6e2560ec6040a7ae283
    container_name: apex-cloudflared-staging
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    depends_on:
      - api
    networks:
      - apex-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

# =============================================================================
# Volumes - Staging-specific (isolated from dev/prod volumes)
# =============================================================================
volumes:
  postgres_staging_data:
    name: apex_postgres_staging_data

# =============================================================================
# Networks
# =============================================================================
networks:
  apex-network:
    name: apex-staging-network
