[project]
name = "apex"
version = "0.39.14"
description = "Apex REST API service for AI content generation"
requires-python = ">=3.13"
authors = [{ name = "Apex Team" }]
dependencies = [
    # Web framework
    "litestar>=2.24.0",
    "granian>=2.7.6",
    "msgspec>=0.21.1",
    "annotated-types>=0.7.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    # Database
    "sqlalchemy[asyncio]>=2.0.50",
    "asyncpg>=0.31.0",
    "alembic>=1.18.4",
    # Storage
    "aioboto3>=15.5.0",
    "types-aiobotocore[s3]>=3.7.0",
    # xAI Grok SDK
    "xai-sdk>=1.17.0",
    # Logging
    "structlog>=26.1.0",
    # Utilities
    "httpx>=0.28.1",
    "python-multipart>=0.0.32",
    "rich>=15.0.0",
    # Authentication
    "argon2-cffi>=25.1.0",
    "PyJWT>=2.13.0",
    "stripe>=15.2.1",
    "resend>=2.30.1",
    "Jinja2>=3.1.6",
    "ffmpeg-python>=0.2.0",
    "limits>=5.8.0",
    "pytest-asyncio>=1.4.0",
    "aiosqlite>=0.22.1",
    "uuid6>=2025.0.1",
    "redis>=8.0.0",
    "tldextract>=5.3.1",
    "typer>=0.26.7",
    "pillow>=12.3.0",
    "pillow-heif>=1.4.0",
    "pywebpush>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.6.0",          # parallel execution with -n auto
    "mypy>=2.1.0",
    "ruff>=0.15.17",
    "pre-commit>=4.6.0",
    "httpx>=0.28.1",                # For test client
    "psycopg2-binary>=2.9.12",       # For alembic sync migrations in test bootstrap
    "watchfiles>=1.2.0",
]

[project.scripts]
apex = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
    "S",    # Enables all Bandit security rules
    "ISC",  # Catches the missing-comma-in-a-list silent string-join bug
    "PIE",  # Misc linters
    "RET",  # flake8-return
    "ASYNC",  # flake8-async enforces async discipline
    "DTZ",  # flake8-datetimez enforces tz-aware datetimes
    "RUF",  # Ruff-native rules
    "LOG",  # flake8-logging
    "G",    # logging-format
    "TRY",  # exception hygiene
    "T20",  # No stray print
    "TID",  # Bans relative imports
    "PLE",  # Pylint errors
    "PLW",  # Pylint warnings
    "FA",   # flake8-future-annotations
    "PGH",  # pygrep-hooks, bans blanket # type: ignore and # noqa
    "TC",   # flake8-type-checking, moves typing-only imports into TYPE_CHECKING
    "FLY",  # F-string formatting style
    "ANN",  # Type annotations
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "ISC001", # conflicts with the formatter
    "TRY003", # conflicts with explicit RuntimeError
]
logger-objects = ["structlog.get_logger", "src.core.logging.get_logger"]  # so LOG/G see structlog
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-decorators = [
    "litestar.get",
    "litestar.post",
    "litestar.put",
    "litestar.patch",
    "litestar.delete",
    "litestar.route",
]
runtime-evaluated-base-classes = [
    "sqlalchemy.orm.DeclarativeBase",
    "msgspec.Struct",
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
]
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",   # Ignore use of assert detected
    "S105",   # Ignore hardcoded password rules in any file within the tests directory
    "S106",   # Ignore possible hardcoded password assigned to argument within the tests directory
    "S107",   # Ignore possible hardcoded password assigned to function default within the tests directory
    "S607",   # Ignore starting a process with a partial executable path
    "ANN001", # Missing type annotation for function argument
    "ANN201", # Missing return type annotation for public function
    "ANN202", # Missing return type annotation for private function
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
]
"src/cli/**/*.py" = ["T20"]   # Typer/Rich print legitimately
"tools/**/*.py" = ["T20"]   # Typer/Rich print legitimately
"tests/contract/*.py" = ["T20"]   # TODO: Review after implementing automation, now print legitimately
"src/core/redis.py" = ["PLW0603"]   # module-level singleton pool, init/close by design
"src/db/session.py" = ["PLW0603"]   # module-level singleton DatabaseManager, init/close by design
"src/api/middleware/rate_limit.py" = ["PLW0603"]   # module-level singleton limiter storage, init by design
"src/api/dependencies/common.py" = ["PLW0603"]   # module-level singleton service container, init/close by design
"src/db/models/*.py" = ["TC003"]   # SQLAlchemy declarative annotations are runtime-sensitive
"src/cli/verify_ipn.py" = ["TC003"]   # Typer resolves annotations at runtime via get_type_hints

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = true
plugins = [
    "sqlalchemy.ext.mypy.plugin",
    "pydantic.mypy"
]

[[tool.mypy.overrides]]
module = [
    "aioboto3.*",
    "boto3.*",
    "botocore.*",
    "moto.*",
    "typer",
    "typer.*",
    "pillow_heif.*",
    "pywebpush.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["src.cli.*"]
# typer decorators (app.command) are untyped since typer isn't installed as a main dep
disable_error_code = ["untyped-decorator"]

[[tool.mypy.overrides]]
module = [
    "src.api.services.grok",
    "src.api.services.grok.*",
]
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=src --cov-report=term-missing --cov-report=xml"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestCollectionWarning",
]
markers = [
    "unit: fast unit tests (no database required)",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20260518",
]
