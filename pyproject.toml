[project]
name = "apex"
version = "0.15.7"
description = "Apex REST API service for AI content generation"
requires-python = ">=3.13"
authors = [{ name = "Apex Team" }]
dependencies = [
    # Web framework
    "litestar>=2.21.0",
    "granian>=2.7.4",
    "msgspec>=0.20.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.45",
    "asyncpg>=0.31.0",
    "alembic>=1.18.1",
    # Storage
    "aioboto3>=15.5.0",
    "types-aiobotocore[s3]>=3.1.0",
    # xAI Grok SDK
    "xai-sdk>=0.1.0",
    # Logging
    "structlog>=24.4.0",
    # Utilities
    "httpx>=0.28.1",
    "python-multipart>=0.0.27",
    "rich>=14.2.0",
    # Authentication
    "argon2-cffi>=25.1.0",
    "PyJWT>=2.12.0",
    "stripe>=14.3.0",
    "resend>=2.23.0",
    "Jinja2>=3.1.0",
    "ffmpeg-python>=0.2.0",
    "limits>=5.8.0",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.22.1",
    "uuid6>=2025.0.1",
    "redis>=7.3.0",
    "tldextract>=5.3.1",
    "typer>=0.24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.6.0",          # parallel execution with -n auto
    "mypy>=1.8.0",
    "ruff>=0.14.13",
    "pre-commit>=3.6.0",
    "httpx>=0.27.0",                # For test client
    "psycopg2-binary>=2.9.9",       # For alembic sync migrations in test bootstrap
    "watchfiles>=1.1.1",
]

[project.scripts]
apex = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
    "S",    # Enables all Bandit security rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "S101",   # FIX in production, Ignore use of assert detected
    "S108",   # FIX in production, probable insecure usage of temporary file or directory
    "S607",   # FIX in production, Starting a process with a partial executable path
]
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",   # Ignore use of assert detected
    "S105",   # Ignore hardcoded password rules in any file within the tests directory
    "S106",   # Ignore possible hardcoded password assigned to argument within the tests directory
    "S107",   # Ignore possible hardcoded password assigned to function default within the tests directory
    "S607",   # Ignore starting a process with a partial executable path
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = true
plugins = [
    "sqlalchemy.ext.mypy.plugin",
    "pydantic.mypy"
]

[[tool.mypy.overrides]]
module = [
    "aioboto3.*",
    "boto3.*",
    "botocore.*",
    "moto.*",
    "typer",
    "typer.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["src.cli.*"]
# typer decorators (app.command) are untyped since typer isn't installed as a main dep
disable_error_code = ["untyped-decorator"]

[[tool.mypy.overrides]]
module = [
    "src.api.services.grok",
    "src.api.services.grok.*",
]
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=src --cov-report=term-missing --cov-report=xml"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestCollectionWarning",
]
markers = [
    "unit: fast unit tests (no database required)",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20260408",
]
