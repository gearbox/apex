# Apex API - Production Overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  redis:
    # In production, don't expose port externally
    ports: []
    restart: always
    # Production logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    # In production, don't expose port externally
    ports: []
    environment:
      # Use stronger password in production (set via .env)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    # Production logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    # Don't build in production - use pre-built image
    image: ${API_IMAGE:-apex-api:latest}
    build: []
    environment:

      DEBUG: "false"
      # JWT — must be set explicitly in production; no fallback allowed
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required in production}
      JWT_ISSUER: ${JWT_ISSUER:-apex-api}

      # Require R2 credentials in production
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?R2_ACCOUNT_ID is required}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID is required}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY is required}

      # Video frame extraction
      FRAME_EXTRACT_MAX_VIDEO_SECONDS: ${FRAME_EXTRACT_MAX_VIDEO_SECONDS:-300}
      FRAME_EXTRACT_FFMPEG_TIMEOUT_SECONDS: ${FRAME_EXTRACT_FFMPEG_TIMEOUT_SECONDS:-30}
      FRAME_EXTRACT_POLL_INTERVAL_SECONDS: ${FRAME_EXTRACT_POLL_INTERVAL_SECONDS:-2}
      FRAME_PREVIEW_MAX_EDGE: ${FRAME_PREVIEW_MAX_EDGE:-512}
      FRAME_PREVIEW_URL_TTL_SECONDS: ${FRAME_PREVIEW_URL_TTL_SECONDS:-3600}
      FRAME_PREVIEW_RETENTION_DAYS: ${FRAME_PREVIEW_RETENTION_DAYS:-2}
      FRAME_EXTRACT_STALE_RUNNING_SECONDS: ${FRAME_EXTRACT_STALE_RUNNING_SECONDS:-1800}
    # Production resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    # Production logging
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    # Restart always in production
    restart: always

  migrations:
    image: ${API_IMAGE:-apex-api:latest}
    build: []
