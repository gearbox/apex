# Apex API - Docker Compose Configuration
# Usage:
#   Development: docker compose up -d
#   Production:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  # ===========================================================================
  # Redis (pub/sub and rate limiting)
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: apex-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - apex-network

  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: apex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-apex}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apex} -d ${POSTGRES_DB:-apex}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - apex-network

  # ===========================================================================
  # Apex API Service
  # ===========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apex-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # API Settings
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      DEBUG: ${DEBUG:-false}
      
      # Database - connects to postgres service
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-apex}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-apex}"
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_ECHO: ${DB_ECHO:-false}
      
      # ComfyUI Connection (external - via SSH tunnel or direct)
      COMFYUI_HOST: ${COMFYUI_HOST:-host.docker.internal}
      COMFYUI_PORT: ${COMFYUI_PORT:-18188}

      # JWT Authentication
      # Generate: python -c "import secrets; print(secrets.token_urlsafe(32))"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required - see CONFIGURATION.md}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      JWT_ISSUER: ${JWT_ISSUER:-apex-api}
      
      # xAI Grok API
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_API_BASE_URL: ${XAI_API_BASE_URL:-https://api.x.ai}
      XAI_TIMEOUT: ${XAI_TIMEOUT:-300}
      GROK_VIDEO_POLL_INTERVAL: ${GROK_VIDEO_POLL_INTERVAL:-5}
      GROK_VIDEO_MAX_POLL_TIME: ${GROK_VIDEO_MAX_POLL_TIME:-600}

      # Cloudflare R2 Storage
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-apex-user-content}
      R2_PUBLIC_URL_BASE: ${R2_PUBLIC_URL_BASE:-}
      
      # Content Settings
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-20}
      
      # Generation Defaults
      DEFAULT_STEPS: ${DEFAULT_STEPS:-12}
      MAX_STEPS: ${MAX_STEPS:-20}
      DEFAULT_CFG: ${DEFAULT_CFG:-1.1}
      DEFAULT_SAMPLER: ${DEFAULT_SAMPLER:-euler}
      DEFAULT_SCHEDULER: ${DEFAULT_SCHEDULER:-beta}

      # Email Settings (Resend)
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-noreply@apex.ai}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Apex}

      # Redis
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}

      # App frontend URL (used for building verification/reset links)
      APP_URL: ${APP_URL:-http://localhost:3000}

      # Branding
      APP_NAME: ${APP_NAME:-Apex}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@apex.ai}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Mount config for workflow bundles (read-only in container)
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - apex-network
    # Allow connecting to host network (for ComfyUI via SSH tunnel)
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ===========================================================================
  # Database Migrations (run once)
  # ===========================================================================
  migrations:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apex-migrations
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-apex}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-apex}"
    command: ["alembic", "upgrade", "head"]
    networks:
      - apex-network
    # Only run once, don't restart
    restart: "no"

# =============================================================================
# Networks
# =============================================================================
networks:
  apex-network:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
